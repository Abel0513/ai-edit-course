<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 自動剪輯實戰｜用 ChatGPT／Claude 做美髮短影音</title>
<style>
/* =========================================================
   樣式（外觀）。一般改內容不用動這裡。
   ========================================================= */
:root{
  --bg:#f1f5f9; --card:#fff; --navy:#1b2f5e; --navy2:#253f7a; --teal:#0e8f7e; --teal-bg:#e6f5f2;
  --rose:#b5476b; --rose-bg:#fbeaf0; --amber:#c27c0e; --amber-bg:#fdf3e1; --red:#c0392b; --red-bg:#fdecea;
  --green:#1f8a4c; --green-bg:#e7f6ec; --text:#334155; --muted:#64748b; --line:#e2e8f0; --soft:#f8fafc;
  --dark:#14213d; --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
button{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{color:var(--navy);line-height:1.35;margin:0}
p{margin:.5em 0}
code,pre{font-family:var(--mono)}

/* ---------- 左側欄 ---------- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:40;padding:18px 12px 30px}
.sb-title{font-size:17px;font-weight:800;color:var(--navy);padding:0 6px}
.sb-sub{font-size:12px;color:var(--muted);padding:0 6px;margin-top:2px}
.sb-prog{margin:12px 6px 4px;height:6px;background:#e9eef5;border-radius:99px;overflow:hidden}
.sb-prog>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.sb-prog-t{font-size:12px;color:var(--muted);padding:0 6px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sb-group{font-size:11.5px;font-weight:800;color:var(--teal);padding:10px 8px 4px;letter-spacing:.05em}
.sb-link{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:13.5px;color:var(--text);text-decoration:none;border-left:3px solid transparent}
.sb-link:hover{background:#f1f5f9}
.sb-link.active{background:var(--teal-bg);border-left-color:var(--teal);font-weight:700;color:var(--navy)}
.sb-link .no{width:16px;color:var(--muted);font-size:12px;text-align:center;flex:none}
.sb-link .nm{flex:1;min-width:0}
.sb-link .mins{color:var(--muted);font-size:12px;font-weight:400}
.sb-link .pc{font-size:11.5px;color:var(--amber);font-weight:700}
.sb-link .pc.ok{color:var(--teal)}

/* ---------- 上方工具列 ---------- */
.main{margin-left:230px;min-height:100vh}
.toolbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 18px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);flex:1;min-width:120px}
.tgroup{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.navbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.navbtn:disabled{opacity:.45;cursor:default}
.navbtn.primary:disabled{background:#94a3b8;border-color:#94a3b8}
.menubtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-size:13px;cursor:pointer}
.overlay{display:none}

/* ---------- 主內容卡片 ---------- */
.content{padding:22px 18px 80px}
.lesson{max-width:780px;margin:0 auto;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.04);border:1px solid #e8edf3;padding:28px 30px 30px}
.lesson.bare{background:transparent;box-shadow:none;border:0;padding:0}
.unit-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pill-navy{background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700}
.lesson h1{font-size:28px;font-weight:800;margin:8px 0 6px}
.lead{color:var(--text);margin:4px 0 8px}
.reqs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.req{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);background:#fff}
.req.ok{background:var(--green-bg);border-color:#b6e2c6;color:var(--green)}
.sec{margin-top:26px;padding-top:4px}
.sec+.sec{border-top:1px solid var(--line);padding-top:22px}
.sec>h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.secno{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:var(--rose);color:#fff;font-size:12.5px;font-weight:800;flex:none}
.small{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;background:#fff;margin:14px 0;overflow:hidden}
.box-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f4f7fb;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);font-size:14px}
.box-h .sp{flex:1}
.box-h .stat{font-weight:400;font-size:12px;color:var(--muted)}
.box-b{padding:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--text);line-height:1.5}
.btn:hover{border-color:#cbd5e1}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:#cbd5e1}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chip.rose.on{background:var(--rose);border-color:var(--rose)}
.callout{border-left:4px solid var(--teal);background:var(--teal-bg);border-radius:8px;padding:12px 16px;margin:14px 0}
.callout.green{border-color:var(--green);background:var(--green-bg)}
.callout.amber{border-color:var(--amber);background:var(--amber-bg)}
.callout.rose{border-color:var(--rose);background:var(--rose-bg)}
.callout.navy{border-color:var(--navy);background:#eef2fa}
.callout .ct{font-weight:800;color:var(--navy);margin-bottom:2px}
.banner{background:linear-gradient(120deg,#1b2f5e,#26437e);color:#fff;border-radius:12px;padding:16px 20px;margin:14px 0}
.banner b{color:#9fe7da}
.tag-pink{display:inline-block;background:var(--rose-bg);color:var(--rose);border-radius:6px;padding:2px 9px;font-size:12px;margin:6px 0}
ul.list,ol.list{padding-left:22px;margin:6px 0}
ul.list li,ol.list li{margin:3px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}
.tblwrap table.tbl{margin:0}
table.tbl th,table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{background:#f4f7fb;color:var(--navy);font-weight:800;white-space:nowrap}
table.tbl td:first-child{font-weight:700;color:var(--navy);min-width:90px}
table.tbl tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.official{background:#e6efff;color:#2753b5}.badge.public{background:var(--teal-bg);color:var(--teal)}
.badge.paid{background:var(--amber-bg);color:var(--amber)}.badge.todo{background:var(--rose-bg);color:var(--rose)}
.codebox{background:var(--dark);color:#e2e8f0;border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;margin:0}
.prompt-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.prompt-card .box-b{padding:14px}
.after{font-size:13px;margin-top:10px}
details.det{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:#fbfcfe}
details.det>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--navy);list-style:none}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::before{content:"▶ ";font-size:11px}
details.det[open]>summary::before{content:"▼ "}
details.det>.dbody{padding:0 14px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.card h3{font-size:15.5px;margin-bottom:6px}
.pros{color:var(--teal);font-weight:800;font-size:12.5px;margin-top:6px}
.cons{color:var(--rose);font-weight:800;font-size:12.5px;margin-top:6px}
.selcard{cursor:pointer;transition:border-color .15s}
.selcard.on{border:2px solid var(--navy);box-shadow:0 0 0 3px rgba(27,47,94,.08)}
.pre-tree{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;white-space:pre;overflow-x:auto;margin:10px 0}

/* 工具卡 */
.toolcard{display:flex;gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.toolcard:last-child{border-bottom:0}
.tc-ill{width:76px;height:56px;border-radius:10px;background:#f1f5f9;border:1px solid var(--line);flex:none;position:relative;overflow:hidden}
.tc-ill i{position:absolute;left:10px;height:5px;border-radius:3px}
.tc-ill b{position:absolute;right:9px;bottom:8px;width:9px;height:9px;border-radius:50%}
.tc-body{flex:1;min-width:0}
.tc-tags{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tc-tags .t{background:#e6efff;color:#2753b5;border-radius:5px;padding:0 6px;font-weight:700}
.tc-tags .t.agent{background:var(--teal-bg);color:var(--teal)}
.tc-tags .t.cloud{background:var(--amber-bg);color:var(--amber)}
.tc-title{font-weight:800;color:var(--navy);font-size:15.5px;margin:2px 0}
.tc-title u{text-decoration-thickness:2px}
.tc-more{background:#f4f7fb;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13.5px}
.tc-more h4{font-size:13px;margin:4px 0}

/* 測驗 */
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fff}
.q-t{font-weight:700;color:var(--navy);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:#f8fafc;border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer;text-align:left;line-height:1.5}
.opt:hover{border-color:#cbd5e1}
.opt.right{background:var(--green-bg);border-color:#7fcb9b;color:var(--green);font-weight:700}
.opt.wrong{background:var(--red-bg);border-color:#ef9a90;color:var(--red);font-weight:700}
.opt.picked{border:2px solid var(--navy);background:#fff}
.opt .s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.q-ex{font-size:13px;margin-top:8px;color:var(--text)}
.q-ex b{color:var(--navy)}
.rate{display:grid;grid-template-columns:140px 110px 1fr;gap:4px 10px;font-size:13px;margin-top:10px;align-items:start}
.rate>div{padding:5px 6px}
.rate .row-hl{background:var(--teal-bg)}
.rate .rn{font-weight:700;color:var(--navy)}
.lv3{color:var(--green);font-weight:700}.lv2{color:var(--amber);font-weight:700}.lv1{color:var(--muted);font-weight:700}

/* 流程圖 */
.flow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:12px 4px 10px}
.flow .st{border:1px solid #cbd5e1;border-radius:9px;padding:8px 12px;text-align:center;min-width:120px;flex:none;background:#fff}
.flow .st b{display:block;color:var(--navy);font-size:13.5px}
.flow .st span{font-size:11.5px;color:var(--muted)}
.flow .ar{color:var(--muted);flex:none}

/* 模擬器 */
.sim{display:grid;grid-template-columns:1fr 200px;gap:18px;align-items:start;margin-top:8px}
.clip{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;cursor:pointer;background:#fff}
.clip.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(27,47,94,.12)}
.clip .bar{height:10px;border-radius:3px;margin:6px 0 2px;display:flex;overflow:hidden}
.stripe{background:repeating-linear-gradient(45deg,#e2e8f0 0 4px,#fff 4px 8px)}
.tl{display:flex;height:30px;border-radius:6px;overflow:hidden;margin:8px 0;position:relative}
.tl>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;border-right:1px solid rgba(255,255,255,.5);padding:0 3px}
.tl .cursor{position:absolute;top:0;bottom:0;width:2px;background:#e11d48;border:0;padding:0}
.phone{width:190px;aspect-ratio:9/16;border:7px solid #1f2937;border-radius:22px;background:#8a6a4f;position:relative;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;margin:0 auto}
.phone .lab{position:absolute;top:6px;left:6px;font-size:9.5px;background:rgba(0,0,0,.45);border-radius:4px;padding:0 5px}
.phone .what{font-size:12px;padding:0 10px}
.phone .cap{position:absolute;bottom:34px;left:8px;right:8px;font-weight:800;font-size:13.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.45}
.phone .tc{position:absolute;bottom:10px;font-size:10px;opacity:.85;font-family:var(--mono)}
.phone .aud{position:absolute;top:24px;left:8px;right:8px;background:var(--teal);border-radius:4px;font-size:10px;padding:1px 0}
.playrow{text-align:center;margin-top:8px;font-size:12px;color:var(--muted)}
.tracks{font-size:11.5px}
.track{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;margin:5px 0}
.track .tn{text-align:right;font-weight:700;color:var(--navy)}
.track .tr{position:relative;height:24px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.track .tr>div{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(255,255,255,.6)}
.wave{background:repeating-linear-gradient(90deg,var(--teal) 0 2px,#5cc3b2 2px 4px)}
.track .tr .cursor{background:#e11d48;width:2px;border:0;z-index:2}

/* 指令產生器 */
.gen{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:10px}
.gen-g{margin-bottom:14px}
.gen-l{font-weight:800;color:var(--navy);font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gen-l .k{background:var(--navy);color:#fff;border-radius:4px;font-size:11px;padding:0 5px}
.gen-r{position:sticky;top:64px}
.gen-head{background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.gen-head b{font-size:16px}
.gen textarea{width:100%;min-height:240px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--font);font-size:13.5px;line-height:1.7;color:var(--text);resize:vertical}
.gen .view{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-height:240px;white-space:pre-wrap}
.src{border-radius:4px;padding:0 1px}
.src-mode{background:#fde2ea}.src-theme{background:#dbeafe}.src-length{background:#fef3c7}.src-style{background:#ede9fe}
.src-feat{background:#dcfce7}.src-plat{background:#e0f2fe}.src-protect{background:#f1f5f9}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;margin:6px 0}
.flash{animation:flash 1.1s ease}
@keyframes flash{0%,40%{outline:2px solid #e11d48}100%{outline:2px solid transparent}}
.qual{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13px}
.qual .qbar{height:6px;background:#e9eef5;border-radius:99px;overflow:hidden;margin:6px 0 8px}
.qual .qbar i{display:block;height:100%;background:var(--teal)}
.qual .ok{color:var(--teal)}.qual .no{color:var(--rose)}
.qual .tip{color:var(--muted);font-size:12px;margin-left:18px}
input.num{width:80px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px}

/* 勾選清單 */
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer;background:#fff;user-select:none}
.check .bx{width:18px;height:18px;border:2px solid #94a3b8;border-radius:5px;flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.check.on{background:var(--teal-bg);border-color:#9ad8cd}
.check.on .bx{background:var(--teal);border-color:var(--teal)}
.check .ct{font-weight:700;color:var(--navy)}
.check .cd{font-size:13px;color:var(--muted)}
/* 句型 */
.sent{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.sblk{border:2px solid #cbd5e1;border-radius:9px;padding:6px 12px;cursor:pointer;text-align:center;background:#fff;font-size:14px}
.sblk small{display:block;font-size:11px;font-weight:700;min-height:16px}
.plus{color:var(--muted)}
.prob{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prob button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:12.5px;text-align:left;cursor:pointer}
.prob button.on{background:var(--rose-bg);border-color:var(--rose);font-weight:700}
.prob button.done:not(.on){background:#fafafa;color:var(--muted)}
.inner{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.inner h4{font-size:14px;margin-bottom:6px}
.tlrow{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;font-size:12px}
.home-hero{background:linear-gradient(125deg,#1b2f5e 0%,#22417a 60%,#4a3d6e 100%);color:#fff;border-radius:16px;padding:28px 30px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center}
.home-hero h1{color:#fff;font-size:27px;margin:6px 0 10px}
.home-hero .k{font-size:12px;opacity:.85}
.home-hero p{opacity:.95;font-size:14px}
.hero-ill{display:flex;align-items:center;gap:10px}
.hero-raw{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;font-size:11px;flex:1}
.hero-raw i{display:block;height:6px;border-radius:3px;margin:5px 0}
.hero-done{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px;font-size:11px;text-align:center;flex:1}
.hero-phone{width:70px;height:110px;margin:6px auto;border-radius:10px;border:3px solid #fff;background:linear-gradient(#d08b5b,#b5476b);display:flex;align-items:flex-end;justify-content:center;font-size:8.5px;font-weight:800;padding-bottom:8px}
.homesec{max-width:780px;margin:26px auto 0}
.homesec>h2{font-size:20px;font-weight:800;margin-bottom:10px;padding-top:16px;border-top:1px solid #dbe3ec}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;color:inherit;display:block}
.pcard:hover{border-color:#cbd5e1}

function pick(o, p) {
  p = p || P();

}

    if (x.__v) return R(pick(x, p), p);
    const o = {}; for (const k in x) o[k] = R(x[k], p); return o;

}

function genSegs(g, p) {
  p = p || P(); const agent = p.endsWith("agent"); const L = genLen(g); const s = [];
  const add = (tag, text) => s.push({ tag, text });
  if (agent) add("plat", G.agentPrefix);
  const F = g.mode === "aroll" ? G.featureText.aroll : G.featureText.multi;
  const has = k => g.feats.indexOf(k) >= 0;
  if (g.mode === "aroll") {
    add("length", `請用我提供的原片剪一支約 ${L} 秒的直式 MP4。`);
    add("mode", G.arollCore);

    ["cut", "trans", "shop", "logo", "outro", "music"].forEach(k => { if (has(k)) add("feat", F[k]); });
    if (has("sub")) { add("feat", F.sub); add("plat", F.subEnd); } else add("plat", F.noSubEnd);
  } else {
    const th = g.theme && G.themes[g.theme] ? G.themes[g.theme] : G.multiGeneric;
    add("mode", "請使用我提供的"); add("theme", th.material); add("length", `，製作一支 ${L} 秒的直式 9:16 短影音。`);
    add("theme", th.order);

    let first = true;
    ["cut", "sub", "trans", "shop", "logo", "outro", "music"].forEach(k => { if (has(k)) { add("feat", (first ? "\n" : "") + F[k]); first = false; } });
    add("protect", "\n" + G.protect);

}

function qualHTML(text, mode) {
  const q = quality(text, mode); const n = q.filter(x => x.ok).length;
  return `<b style="color:var(--navy)">指令品質回饋</b>　${n}／${q.length} 項<div class="qbar"><i style="width:${n / q.length * 100}%"></i></div>` +
    q.map(x => `<div class="${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "○"} ${esc(x.label)}</div>${x.ok ? "" : `<div class="tip">${esc(x.label)}：${esc(x.tip)}</div>`}`).join("") +
    (n === q.length ? `<div class="ok" style="margin-top:6px;font-weight:700">這段指令很完整，可以拿去用了。</div>` : "");
}
function findBlock(pid, type) {
  let found = null; const walk = arr => (arr || []).forEach(b => { if (found) return; if (b.t === type) found = b; if (b.tabs) b.tabs.forEach(t => walk(t.blocks)); });
  const pg = C.pages[pid]; walk(pg.blocks); walk(pg.intro); (pg.sections || []).forEach(s => walk(s.blocks)); return found;
}
function arollModel(b, ver) {
  const speech = [], pauses = [];
  if (ver === 0) { let t = 0; b.lines.forEach((l, i) => { const d = b.times[i][1] - b.times[i][0]; speech.push([t, d, l.slice(0, 7) + "…", l]); t += d; b.pauses.forEach(p => { if (p[0] === i) { pauses.push([t, p[1], p[2]]); t += p[1]; } }); }); return { speech, pauses, total: t }; }
  b.lines.forEach((l, i) => speech.push([b.times[i][0], b.times[i][1] - b.times[i][0], l.slice(0, 7) + "…", l]));
  return { speech, pauses, total: b.times[b.times.length - 1][1] };
}

    <div class="tgroup">模式 ${seg("mode", [["student", "學員"], ["teacher", "講師"]])}</div>
    <button class="navbtn" data-act="go" data-v="${o[i - 1] || ""}" ${i <= 0 ? "disabled" : ""}>← 上一頁</button>
    <button class="navbtn primary" data-act="go" data-v="${o[i + 1] || ""}" ${i >= o.length - 1 ? "disabled" : ""}>下一頁 →</button>`;
}
function reqsHTML(pg) { return `<div class="reqs" id="reqs">${pg.reqs.map(r => `<span class="req ${S.done[r.id] ? "ok" : ""}">${S.done[r.id] ? "✓" : "○"} ${esc(r.label)}</span>`).join("")}</div>`; }
function unitEndHTML(id) {
  const pg = C.pages[id]; const left = pg.reqs.filter(r => !S.done[r.id]); const ups = unitPages(); const nx = ups[ups.indexOf(id) + 1];
  const nextBtn = nx ? `<a class="btn navy" href="#${nx}">前往第 ${C.pages[nx].unit} 單元：${esc(C.pages[nx].nav)} →</a>` : `<a class="btn navy" href="#review">前往課後複習 →</a>`;
  return `<div class="unit-end ${left.length ? "" : "done"}" id="unitEnd">${left.length ? `<h3>這個單元還差 ${left.length} 項</h3><p class="small">還沒完成：${left.map(r => "「" + esc(r.label) + "」").join("、")}。沒做完也可以先往下，之後再回來補。</p>`
    : `<h3>這個單元完成了</h3><p class="small">做得好。可以進入下一單元，或按「重新練習」再做一次。</p>`}<div class="row mt">${nextBtn}<button class="btn" data-act="resetUnit">重新練習這個單元</button></div></div>`;
}
function renderHome() {
  const pg = R(C.pages.home), h = pg.hero;
  const statusOf = v => v === 0 ? "尚未開始" : v === 100 ? "完成" : "進行中";
  return `<div class="lesson bare"><div class="home-hero"><div><div class="k">${esc(h.kicker)}</div><h1>${esc(h.title)}</h1><p>${esc(h.text)}</p>
    <div class="row mt"><a class="btn teal" href="#u1">開始學習 →</a><a class="btn ghost" href="#prep">課前準備</a></div></div>
    <div><div class="hero-ill"><div class="hero-raw"><b>${esc(h.rawTitle)}</b><div style="opacity:.8">${esc(h.rawSub)}</div><i style="width:70%;background:#8a6a4f"></i><i style="width:100%;background:#b5476b"></i><i style="width:85%;background:#c98a4b"></i><div style="opacity:.8">${esc(h.rawNote)}</div></div>
    <span style="font-size:20px">→</span><div class="hero-done"><b>${esc(h.doneTitle)}</b><div class="hero-phone">${esc(h.phoneText)}</div><div style="opacity:.85">${esc(h.doneNote)}</div></div></div>
    <p class="small" style="color:#cbd5e1;text-align:right;margin-top:8px">${esc(h.caption)}</p></div></div>
    <div class="homesec"><h2>課程進度（共 ${C.totalMinutes} 分鐘）</h2><div class="grid4">${unitPages().map(id => { const u = C.pages[id], v = pct(id);
      return `<a class="pcard" href="#${id}"><b>${u.unit}. ${esc(u.nav)}</b><div class="m">${u.minutes} 分鐘</div><div class="pbar"><i style="width:${v}%"></i></div><div class="m">${statusOf(v)}</div></a>`; }).join("")}</div></div>
    <div class="homesec"><h2>學完你會做到</h2><div class="grid2">${pg.learn.map(c => `<div class="card"><h3>${esc(c.title)}</h3><ul class="list">${c.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div>
    <div class="homesec"><h2>兩條實作路線</h2>${RENDER.routeCards({ selectable: false })}</div></div>`;
}
function renderPage() {
  BLK = {}; COPY = []; detN = 0;
  if (cur === "home") return renderHome();
  const pg = R(C.pages[cur]);
  let h = `<article class="lesson">`;
  h += pg.unit ? `<div class="unit-tag"><span class="pill-navy">第 ${pg.unit} 單元</span>建議 ${pg.minutes} 分鐘</div>` : `<div class="unit-tag"><span class="pill-navy">${esc(pg.tag)}</span></div>`;
  h += `<h1>${esc(pg.title)}</h1>${pg.lead ? `<p class="lead">${pg.lead}</p>` : ""}`;
  if (pg.reqs) h += reqsHTML(pg);
  h += blocks(pg.intro) + blocks(pg.blocks);
  (pg.sections || []).forEach((s, i) => { h += `<section class="sec"><h2><span class="secno">${i + 1}</span>${s.title}</h2>${blocks(s.blocks)}</section>`; });
  if (pg.unit) h += unitEndHTML(cur);
  return h + `</article>`;
}
function chrome() {
  renderSidebar();
  const pg = C.pages[cur];
  if (pg.reqs) { const r = $("#reqs"); if (r) r.outerHTML = reqsHTML(pg); const u = $("#unitEnd"); if (u) u.outerHTML = unitEndHTML(cur); }
  if (cur === "u7" || cur === "home") { /* progress cards */ document.querySelectorAll(".grid4").forEach(() => {}); }
  save();
}
function refresh(keepScroll) {
  const y = window.scrollY; stopAll();
  renderSidebar(); renderToolbar(); $("#content").innerHTML = renderPage(); save();
  if (keepScroll) window.scrollTo(0, y);
}
function rb(id) {
  const b = BLK[id]; if (!b) return refresh(true);
  document.querySelectorAll(`[data-block="${CSS.escape(id)}"]`).forEach(el => { el.outerHTML = block(b); });
}
function route() {
  let id = (location.hash || "#home").slice(1);
  if (!C.pages[id]) id = "home";
  if (id === "teacher" && S.mode !== "teacher") { location.replace("#review"); return; }
  cur = id; document.body.classList.remove("menu-open"); refresh(false); window.scrollTo(0, 0);
  document.title = (id === "home" ? "" : C.pages[id].crumb + "｜") + C.title;
}

/* ---------- 互動 ---------- */
function checkReq(b) {
  if (!b || !b.req) return;
  const st = S.d[b.id];
  let ok = false;
  switch (b.t) {
    case "toolcards": ok = st && st.seen.length >= b.items.length; break;
    case "quiz": ok = st && Object.keys(st).length >= b.qs.length; break;
    case "match": ok = st && Object.keys(st).length >= (b.reqMin || b.qs.length); break;
    case "tabs": ok = st && st.seen.length >= (b.reqMin || 2); break;
    case "stratSim": ok = st && st.tried.length >= (b.reqMin || 2); break;
    case "arollSim": ok = st && st.seen.length >= (b.reqMin || 2); break;
    case "steps": { const s2 = S.d[b.id + "." + P()] || {}; ok = b.items.every((x, i) => s2[i]); break; }
    case "sentence": ok = st && Object.keys(st).length >= b.parts.length; break;
    case "editPractice": ok = st && st.made.length >= (b.reqMin || 3); break;
    case "publishCheck": { const s2 = S.d["u6.publish"] || {}; ok = C.publishChecks.every((x, i) => s2[i]); break; }
    case "homework": ok = st && st.sel != null; break;
  }
  if (b.t === "publishCheck") setDone(b.req || "u6.publish", ok); else if (ok) setDone(b.req, true);
}
function blockReset(id) {
  const b = BLK[id]; delete S.d[id]; if (T[id]) { clearInterval(T[id].timer); delete T[id]; }
  if (b && b.req) setDone(b.req, false);
}
function togglePlay(id) {
  const b = BLK[id]; const tm = T[id];
  if (tm.playing) { clearInterval(tm.timer); tm.playing = false; rb(id); return; }
  const total = b.t === "stratSim" ? b.total : arollModel(b, S.d[id].ver).total;
  const speed = b.t === "stratSim" ? 2 : (b.speed || 1.5);
  if (tm.t >= total) tm.t = 0;
  tm.playing = true;
  tm.timer = setInterval(() => { tm.t = Math.min(total, tm.t + 0.1 * speed); if (tm.t >= total) { clearInterval(tm.timer); tm.playing = false; } rb(id); }, 100);
  rb(id);
}
const ACT = {
  menu: () => document.body.classList.toggle("menu-open"),
  go: el => { if (el.dataset.v) location.hash = "#" + el.dataset.v; },
  ai: el => { S.ai = el.dataset.v; if (el.dataset.req) setDone(el.dataset.req, true); refresh(true); },
  route: el => { S.route = el.dataset.v; if (cur === "u4") setDone("u4.pick", true); refresh(true); },
  mode: el => { S.mode = el.dataset.v; if (S.mode !== "teacher" && cur === "teacher") { location.hash = "#review"; return; } refresh(true); },
  copy: el => { copyText(COPY[+el.dataset.ci]); flashCopied(el); if (el.dataset.req) { setDone(el.dataset.req, true); chrome(); } },
  toolcard: el => { const id = el.dataset.id, i = +el.dataset.i, st = S.d[id]; const k = st.open.indexOf(i); if (k >= 0) st.open.splice(k, 1); else { st.open.push(i); if (st.seen.indexOf(i) < 0) st.seen.push(i); } checkReq(BLK[id]); rb(id); chrome(); },
  quiz: el => { const id = el.dataset.id, st = S.d[id]; if (st[el.dataset.q] !== undefined) return; st[el.dataset.q] = +el.dataset.o; checkReq(BLK[id]); rb(id); chrome(); },
  match: el => { const id = el.dataset.id; S.d[id][el.dataset.q] = +el.dataset.o; checkReq(BLK[id]); rb(id); chrome(); },
  resetBlock: el => { blockReset(el.dataset.id); rb(el.dataset.id); chrome(); },
  tab: el => { const id = el.dataset.id, st = S.d[id], i = +el.dataset.i; st.cur = i; if (st.seen && st.seen.indexOf(i) < 0) st.seen.push(i); checkReq(BLK[id]); rb(id); chrome(); },
  clip: el => { const id = el.dataset.id; S.d[id].clip = +el.dataset.i; rb(id); },
  strat: el => { const id = el.dataset.id, st = S.d[id], i = +el.dataset.i; st.strat = i; if (st.tried.indexOf(i) < 0) st.tried.push(i); T[id].t = 0; checkReq(BLK[id]); rb(id); chrome(); },
  ver: el => { const id = el.dataset.id, st = S.d[id], i = +el.dataset.i; st.ver = i; if (st.seen.indexOf(i) < 0) st.seen.push(i); clearInterval(T[id].timer); T[id].playing = false; T[id].t = 0; checkReq(BLK[id]); rb(id); chrome(); },
  play: el => togglePlay(el.dataset.id),
  gen: el => {
    const g = genState(), k = el.dataset.k; let val = el.dataset.v;
    if (k === "ai") { S.ai = val; } else if (k === "route") { S.route = val; }
    else if (k === "mode") { g.mode = val; if (val === "multi" && !g.theme) g.theme = "染髮前後對比"; }
    else if (k === "theme" || k === "style") { g[k] = g[k] === val ? null : val; }
    else if (k === "len") { g.len = val === "custom" ? "custom" : +val; }
    else if (k === "feat") { const i = g.feats.indexOf(val); if (i >= 0) g.feats.splice(i, 1); else g.feats.push(val); }
    g.text = null; genFlash = { ai: "plat", route: "plat", mode: "mode", theme: "theme", style: "style", len: "length", feat: "feat" }[k];
    setDone("u3.gen", true);
    if (k === "ai" || k === "route") refresh(true); else { rb("u3.gen"); chrome(); }
    setTimeout(() => { genFlash = null; }, 1200);
  },
  genView: el => { genState().view = el.dataset.v; rb("u3.gen"); save(); },
  genRegen: () => { genState().text = null; rb("u3.gen"); save(); toast("已依選項重新產生"); },
  genReset: () => { const v = genState().view; S.d["u3.gen"] = JSON.parse(JSON.stringify(Object.assign({ text: null, view: v }, G.defaults))); rb("u3.gen"); save(); },
  copyGen: el => { copyText(genText()); flashCopied(el); setDone("u3.copy", true); setDone("u3.gen", true); chrome(); },
  gotoGenAroll: () => { const g = genState(); g.mode = "aroll"; g.text = null; setDone("ub.gen", true); save(); location.hash = "#u3"; },
  check: el => { const id = el.dataset.id, st = D(id, {}), i = el.dataset.i; if (st[i]) delete st[i]; else st[i] = true; rb(id); chrome(); },
  step: el => { const id = el.dataset.id, st = D(id + "." + P(), {}), i = el.dataset.i; if (st[i]) delete st[i]; else st[i] = true; checkReq(BLK[id]); rb(id); chrome(); },
  pub: el => { const st = D("u6.publish", {}), i = el.dataset.i; if (st[i]) delete st[i]; else st[i] = true; checkReq(BLK[el.dataset.id] || { t: "publishCheck", req: "u6.publish" }); setDone("u6.publish", C.publishChecks.every((x, k) => st[k])); rb(el.dataset.id); chrome(); },
  pubClear: el => { S.d["u6.publish"] = {}; setDone("u6.publish", false); rb(el.dataset.id); chrome(); },
  trouble: el => { const id = el.dataset.id; S.d[id].sel = +el.dataset.i; rb(id); save(); },
  sent: el => { const id = el.dataset.id; S.d[id][el.dataset.i] = true; checkReq(BLK[id]); rb(id); chrome(); },
  prob: el => { const id = el.dataset.id, st = S.d[id], i = +el.dataset.i; st.cur = i; if (st.made.indexOf(i) < 0) st.made.push(i); checkReq(BLK[id]); rb(id); chrome(); },
  param: el => { const id = el.dataset.id, st = S.d[id]; const p = C.editPractice.problems[st.cur]; const sel = st.sel[st.cur] || p.params.map(() => 0); sel[+el.dataset.k] = +el.dataset.j; st.sel[st.cur] = sel; rb(id); save(); },
  hw: el => { const id = el.dataset.id; S.d[id].sel = +el.dataset.i; checkReq(BLK[id]); rb(id); chrome(); },
  tpl: el => { D("review.tpl", {}).p = el.dataset.v; rb("review.tabs"); save(); },
  resetUnit: () => {
    const pre = cur + "."; Object.keys(S.d).forEach(k => { if (k.startsWith(pre)) delete S.d[k]; }); Object.keys(S.done).forEach(k => { if (k.startsWith(pre)) delete S.done[k]; });
    Object.keys(T).forEach(k => { if (k.startsWith(pre)) { clearInterval(T[k].timer); delete T[k]; } });
    refresh(false); window.scrollTo(0, 0); toast("已重設這個單元");
  }
};
function flashCopied(el) { const l = el.dataset.label || el.textContent; el.textContent = "已複製 ✓"; toast("已複製到剪貼簿"); setTimeout(() => { if (el.isConnected) el.textContent = l; }, 1300); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) { if (e.target.id === "overlay") document.body.classList.remove("menu-open"); return; }
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.inp; if (!k) return;
  const g = genState();
  if (k === "genText") { g.text = e.target.value; setDone("u3.gen", true); const q = $("#genQual"); if (q) q.innerHTML = qualHTML(g.text, g.mode); chrome(); }
  if (k === "genCustom") { g.custom = e.target.value; g.text = null; setDone("u3.gen", true); save(); }
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.inp === "genCustom") { rb("u3.gen"); chrome(); } });
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.det) { if (d.open) DET.add(d.dataset.det); else DET.delete(d.dataset.det); } }, true);
$("#overlay").addEventListener("click", () => document.body.classList.remove("menu-open"));
$("#sidebar").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("menu-open"); });
window.addEventListener("hashchange", route);
window.__course = { S, refresh, P };   /* 給測試用 */
route();
})();
</script>
